name: Build (electron-builder)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    env:
      # Builds unsigned in CI by default
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Reduce noisy downloads
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linux build deps (AppImage + deb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Clean dist
        run: npm run clean

      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run build:win

      - name: Build Linux (AppImage + deb)
        if: runner.os == 'Linux'
        run: npm run build:linux:appimage && npm run build:linux

      - name: Build macOS
        if: runner.os == 'macOS'
        run: npm run build:mac

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/**
          if-no-files-found: error

